<script>
if('serviceWorker' in navigator){
  var swReg=null, swReloaded=false;
  var swHadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!swHadController || swReloaded) return;
    swReloaded=true; window.location.reload();
  });
  window.addEventListener('load', function(){
    /* La URL de sw.js lleva ?v=<app-ver> para que cada version sea una peticion
       de red distinta -- convencion de toda la suite, ver rds-reactiontrial-test. */
    var verEl = document.querySelector('.app-ver');
    var swUrl = 'sw.js?v=' + encodeURIComponent(verEl ? verEl.textContent.trim() : Date.now());
    navigator.serviceWorker.register(swUrl, {updateViaCache:'none'}).then(function(reg){
      swReg=reg;
      reg.update();
      if(reg.waiting && navigator.serviceWorker.controller){ reg.waiting.postMessage({action:'skipWaiting'}); }
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage({action:'skipWaiting'});
          }
        });
      });
    }).catch(function(){});
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && swReg){ swReg.update(); }
  });
}
</script>

<style>

  .champ-form input[type=text]{width:100%;padding:9px 10px;border:2px solid var(--borde);border-radius:6px;font-size:13px;font-family:inherit;}

  .app-ver{ text-align:center; color:#cfcfcf; font-size:0.66rem; letter-spacing:0.1em; padding:2px 0 0; }
</style>

<!-- Firebase (mismo proyecto compartido que el resto de la suite) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, updateDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBbEgbWddPt_rhPM24bL_Nacp7TAlh1biM",
  authDomain: "rds-reaction-test.firebaseapp.com",
  projectId: "rds-reaction-test",
  storageBucket: "rds-reaction-test.firebasestorage.app",
  messagingSenderId: "490684952529",
  appId: "1:490684952529:web:bb53a9813bd58ecdb3baf0"
};
let db=null;
try{
  const app=initializeApp(firebaseConfig);
  try{ db=initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch(e){ db=getFirestore(app); }
}catch(e){ db=null; }
window.hubReady=!!db;
window.hubAddChamp=async function(rec){
  if(!db) throw new Error('no-db');
  return addDoc(collection(db,'hub_campeonatos'), rec);
};
window.hubUpdateChamp=async function(id,rec){
  if(!db) throw new Error('no-db');
  return updateDoc(doc(db,'hub_campeonatos',id), rec);
};
window.hubDeleteChamp=async function(id){
  if(!db) throw new Error('no-db');
  return deleteDoc(doc(db,'hub_campeonatos',id));
};
window.hubLoadChamps=async function(){
  if(!db) return [];
  try{
    const snap=await getDocs(collection(db,'hub_campeonatos'));
    const out=[]; snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data())); });
    return out;
  }catch(e){ return []; }
};
</script>

<script>
function $(id){ return document.getElementById(id); }

/* ---------- Catalogo de apps de la suite (registro de partida) ----------
   De momento es una lista fija en el codigo: las 12 apps que existen hoy.
   Pendiente (fase siguiente): leer tambien una coleccion hub_apps en
   Firestore y fusionarla con esta lista, para poder dar de alta apps
   nuevas desde el panel de admin sin tocar este archivo. */
var APPS=[
  { slug:'rds-ballcoordination-test', name:'Ball Coordination', icon:'icons/rds-ballcoordination-test.png' },
  { slug:'rds-lightsreaction-test',   name:'Lights Speed',      icon:'icons/rds-lightsreaction-test.png' },
  { slug:'rds-perception-test',       name:'Perception',        icon:'icons/rds-perception-test.png' },
  { slug:'rds-processing-test',       name:'Processing',        icon:'icons/rds-processing-test.png' },
  { slug:'rds-rallymemory-test',      name:'Rally Memory',      icon:'icons/rds-rallymemory-test.png' },
  { slug:'rds-reaction-test',         name:'Velocidad de Reacci&#243;n', icon:'icons/rds-reaction-test.png' },
  { slug:'rds-reactiontenis-test',    name:'Reaction Tenis',    icon:'icons/rds-reactiontenis-test.png' },
  { slug:'rds-circuit-test',          name:'Circuit Reaction',  icon:'icons/rds-circuit-test.png' },
  { slug:'rds-gimnasia-test',         name:'Gimnasia',          icon:'icons/rds-gimnasia-test.png' },
  { slug:'rds-memorycards-test',      name:'Memory Cards',      icon:'icons/rds-memorycards-test.png' },
  { slug:'rds-reactionkarate-test',   name:'Reaction Karate',   icon:'icons/rds-reactionkarate-test.png' },
  { slug:'rds-reactiontrial-test',    name:'Reaction Trial',    icon:'icons/rds-reactiontrial-test.png' }
];
function appUrl(slug){ return 'https://rdsk27.github.io/'+slug+'/'; }

/* ---------- Pestanas ---------- */
function showTab(id){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-tab')===id); });
  $('panel-'+id).classList.add('active');
}
$('tabs').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  showTab(b.getAttribute('data-tab'));
});

/* ---------- Rankings: rejilla de botones ---------- */
function renderAppGrid(){
  var g=$('appGrid'); g.innerHTML='';
  APPS.forEach(function(a){
    var btn=document.createElement('a');
    btn.className='app-btn';
    btn.href=appUrl(a.slug);
    btn.target='_blank';
    btn.rel='noopener';
    btn.innerHTML='<img src="'+a.icon+'" alt=""><span>'+a.name+'</span>';
    g.appendChild(btn);
  });
}
renderAppGrid();

/* ---------- Admin ----------
   Sin login de verdad (como el resto de la suite): una clave fija que se
   comprueba tambien en las reglas de Firestore (request.resource.data.adminKey
   / resource.data.adminKey) para poder escribir/editar/borrar campeonatos.
   Se guarda en localStorage para no volver a teclearla en este dispositivo. */
var ADMIN_KEY='RDS-ADMIN-2026';
var ADMIN_LS='suiterds_admin_key';
function isAdmin(){ try{ return localStorage.getItem(ADMIN_LS)===ADMIN_KEY; }catch(e){ return false; } }
function renderAdminBar(){
  var bar=$('adminBar');
  if(isAdmin()){
    bar.innerHTML='<span class="admin-chip">Admin</span><button class="admin-lock" id="btnLogoutAdmin">Cerrar sesi&#243;n</button>';
    $('btnLogoutAdmin').addEventListener('click', function(){
      try{ localStorage.removeItem(ADMIN_LS); }catch(e){}
      renderAdminBar(); renderAdminLogin(); $('btnNewChamp').style.display='none'; closeChampForm();
    });
  } else {
    bar.innerHTML='<button class="admin-lock" id="btnShowLogin">&#128274; Admin</button>';
    $('btnShowLogin').addEventListener('click', function(){
      $('adminLoginBox').innerHTML? closeAdminLogin() : renderAdminLogin();
    });
  }
  $('btnNewChamp').style.display=isAdmin()?'':'none';
}
function closeAdminLogin(){ $('adminLoginBox').innerHTML=''; }
function renderAdminLogin(){
  var box=$('adminLoginBox');
  box.innerHTML='<div class="admin-login">'
    +'<input type="text" id="adminPinInput" placeholder="Clave admin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'
    +'<button id="btnAdminGo">Entrar</button>'
    +'</div>';
  $('btnAdminGo').addEventListener('click', function(){
    var v=($('adminPinInput').value||'').trim();
    if(v===ADMIN_KEY){
      try{ localStorage.setItem(ADMIN_LS, v); }catch(e){}
      closeAdminLogin(); renderAdminBar();
    } else {
      $('adminPinInput').style.borderColor='#b03020';
    }
  });
}

/* ---------- Campeonatos: listado ---------- */
var CHAMPS=[];
function tipoLabel(t){ return t==='avg' ? 'Valor' : 'Posici&#243;n'; }
function appNameOf(slug){ var a=APPS.filter(function(x){ return x.slug===slug; })[0]; return a?a.name:slug; }
function renderChampList(){
  var host=$('champList');
  if(!CHAMPS.length){
    host.innerHTML='<div class="hint">A&#250;n no hay campeonatos creados.</div>';
    return;
  }
  host.innerHTML='';
  CHAMPS.forEach(function(c){
    var card=document.createElement('div'); card.className='champ-card';
    var pruebasTxt=(c.entries||[]).map(function(e){ return appNameOf(e.app)+' &middot; '+esc(e.modo)+' ('+tipoLabel(e.tipo)+')'; }).join('<br>');
    card.innerHTML='<h3>'+esc(c.title)+'</h3>'
      +'<div class="pruebas">'+pruebasTxt+'</div>'
      +'<button class="champ-open" data-id="'+c.id+'">Ver tabla</button>'
      +(isAdmin()?('<div class="champ-actions"><button class="edit" data-id="'+c.id+'">Editar</button><button class="danger del" data-id="'+c.id+'">Borrar</button></div>'):'');
    host.appendChild(card);
  });
  host.querySelectorAll('.champ-open').forEach(function(b){ b.addEventListener('click', function(){ openChampTable(b.getAttribute('data-id')); }); });
  host.querySelectorAll('.edit').forEach(function(b){ b.addEventListener('click', function(){ openChampForm(b.getAttribute('data-id')); }); });
  host.querySelectorAll('.del').forEach(function(b){ b.addEventListener('click', function(){ deleteChamp(b.getAttribute('data-id')); }); });
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
async function loadChamps(){
  CHAMPS = window.hubLoadChamps ? (await window.hubLoadChamps()) : [];
  renderChampList();
}

/* Tabla en vivo por campeonato: pendiente (fase siguiente) -- necesita un
   adaptador por app que sepa leer su coleccion/estructura de modos real.
   De momento solo confirma que el campeonato existe y que prueba tiene. */
function openChampTable(id){
  var c=CHAMPS.filter(function(x){ return x.id===id; })[0]; if(!c) return;
  alert('Tabla de "'+c.title+'": en construcción. Próximamente comparará aquí los resultados reales de cada prueba.');
}

/* ---------- Campeonatos: crear / editar ---------- */
var FORM_ENTRIES=[], FORM_EDIT_ID=null;
function closeChampForm(){ $('champForm').innerHTML=''; FORM_ENTRIES=[]; FORM_EDIT_ID=null; }
function openChampForm(editId){
  if(!isAdmin()) return;
  FORM_EDIT_ID = editId || null;
  var existing = editId ? CHAMPS.filter(function(x){ return x.id===editId; })[0] : null;
  FORM_ENTRIES = existing ? (existing.entries||[]).map(function(e){ return Object.assign({}, e); }) : [];
  var box=$('champForm');
  box.innerHTML='<div class="champ-form">'
    +'<label>T&#237;tulo</label>'
    +'<input type="text" id="champTitleInput" placeholder="p. ej. Resistencia" value="'+esc(existing?existing.title:'')+'">'
    +'<label>Pruebas</label>'
    +'<div id="pruebaRows"></div>'
    +'<button type="button" class="add-prueba" id="btnAddPrueba">+ A&#241;adir prueba</button>'
    +'<div class="champ-form-actions"><button class="save" id="btnSaveChamp">Guardar</button><button class="cancel" id="btnCancelChamp">Cancelar</button></div>'
    +'</div>';
  renderPruebaRows();
  $('btnAddPrueba').addEventListener('click', function(){ FORM_ENTRIES.push({app:APPS[0].slug, modo:'', tipo:'pos'}); renderPruebaRows(); });
  $('btnSaveChamp').addEventListener('click', saveChampForm);
  $('btnCancelChamp').addEventListener('click', closeChampForm);
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
function renderPruebaRows(){
  var host=$('pruebaRows'); if(!host) return;
  host.innerHTML='';
  FORM_ENTRIES.forEach(function(entry, idx){
    var row=document.createElement('div'); row.className='prueba-row';
    var appSel=document.createElement('select');
    APPS.forEach(function(a){ var o=document.createElement('option'); o.value=a.slug; o.textContent=a.name.replace(/&#\d+;/g,''); if(a.slug===entry.app) o.selected=true; appSel.appendChild(o); });
    appSel.addEventListener('change', function(){ entry.app=appSel.value; });
    var modoInput=document.createElement('input'); modoInput.type='text'; modoInput.placeholder='Modo (p. ej. Extremo 10)'; modoInput.value=entry.modo||'';
    modoInput.addEventListener('input', function(){ entry.modo=modoInput.value; });
    var tipoSel=document.createElement('select'); tipoSel.className='tipo';
    ['pos','avg'].forEach(function(t){ var o=document.createElement('option'); o.value=t; o.textContent=(t==='pos'?'Posición':'Valor'); if(t===entry.tipo) o.selected=true; tipoSel.appendChild(o); });
    tipoSel.addEventListener('change', function(){ entry.tipo=tipoSel.value; });
    var rm=document.createElement('button'); rm.type='button'; rm.className='rm-row'; rm.textContent='×';
    rm.addEventListener('click', function(){ FORM_ENTRIES.splice(idx,1); renderPruebaRows(); });
    row.appendChild(appSel); row.appendChild(modoInput); row.appendChild(tipoSel); row.appendChild(rm);
    host.appendChild(row);
  });
}
async function saveChampForm(){
  var title=($('champTitleInput').value||'').trim();
  if(!title){ $('champTitleInput').style.borderColor='#b03020'; return; }
  if(!FORM_ENTRIES.length){ alert('Añade al menos una prueba.'); return; }
  var rec={ title:title, entries:FORM_ENTRIES, adminKey:ADMIN_KEY, updatedAt:Date.now() };
  try{
    if(FORM_EDIT_ID){ await window.hubUpdateChamp(FORM_EDIT_ID, rec); }
    else { rec.createdAt=Date.now(); await window.hubAddChamp(rec); }
    closeChampForm();
    await loadChamps();
  }catch(e){ alert('No se pudo guardar. Comprueba la conexión o las reglas de Firestore.'); }
}
async function deleteChamp(id){
  if(!confirm('¿Seguro que quieres borrar este campeonato?')) return;
  try{ await window.hubDeleteChamp(id); await loadChamps(); }
  catch(e){ alert('No se pudo borrar.'); }
}

$('btnNewChamp').addEventListener('click', function(){ openChampForm(null); });

renderAdminBar();
loadChamps();
</script>
