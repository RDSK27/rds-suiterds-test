<script>
if('serviceWorker' in navigator){
  var swReg=null, swReloaded=false;
  var swHadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!swHadController || swReloaded) return;
    swReloaded=true; window.location.reload();
  });
  window.addEventListener('load', function(){
    /* La URL de sw.js lleva ?v=<app-ver> para que cada version sea una peticion
       de red distinta -- convencion de toda la suite, ver rds-reactiontrial-test. */
    var verEl = document.querySelector('.app-ver');
    var swUrl = 'sw.js?v=' + encodeURIComponent(verEl ? verEl.textContent.trim() : Date.now());
    navigator.serviceWorker.register(swUrl, {updateViaCache:'none'}).then(function(reg){
      swReg=reg;
      reg.update();
      if(reg.waiting && navigator.serviceWorker.controller){ reg.waiting.postMessage({action:'skipWaiting'}); }
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage({action:'skipWaiting'});
          }
        });
      });
    }).catch(function(){});
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && swReg){ swReg.update(); }
  });
}
</script>

<!-- Firebase (mismo proyecto compartido que el resto de la suite) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDoc, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBbEgbWddPt_rhPM24bL_Nacp7TAlh1biM",
  authDomain: "rds-reaction-test.firebaseapp.com",
  projectId: "rds-reaction-test",
  storageBucket: "rds-reaction-test.firebasestorage.app",
  messagingSenderId: "490684952529",
  appId: "1:490684952529:web:bb53a9813bd58ecdb3baf0"
};
/* SuiteRDS lee/escribe siempre en linea (rankings de otras apps, admin de
   campeonatos) -- a diferencia de las 12 apps de ejercicio, no necesita
   persistencia offline. Se usa getFirestore() a secas, sin
   initializeFirestore+persistentLocalCache+persistentMultipleTabManager:
   ese modo de persistencia puede quedarse esperando un candado entre
   pestanas/sesiones del mismo origen sin liberarse nunca (reportado
   2026-09-28: "Clasificacion se queda en Calculando... y no avanza"). Ver
   tambien FETCH_TIMEOUT_MS mas abajo, como red de seguridad aparte. */
let db=null;
try{
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app);
}catch(e){ db=null; }
window.hubReady=!!db;

/* Clave de acceso a la suite (2026-09-29): compartida entre las 12 apps
   y SuiteRDS via localStorage (mismo origen). Se lee de Firestore
   hub_config/access -- cambiar la clave ahi "echa" a quien ya habia
   entrado, porque se revalida contra el valor actual cada vez que hay
   red. Sin red, se confia en la ultima clave verificada (si la hay). */
var GATE_LS='rds_suite_access_key';
function gateWithTimeout(p,ms){
  return new Promise(function(resolve,reject){
    var done=false, t=setTimeout(function(){ if(!done){ done=true; reject(new Error('timeout')); } }, ms);
    p.then(function(v){ if(!done){ done=true; clearTimeout(t); resolve(v); } }, function(e){ if(!done){ done=true; clearTimeout(t); reject(e); } });
  });
}
async function fetchGateKey(){
  if(!db) return undefined;
  try{
    var snap=await gateWithTimeout(getDoc(doc(db,'hub_config','access')), 8000);
    return (snap && snap.exists()) ? (snap.data().key||null) : null;
  }catch(e){ return undefined; }
}
function gateShow(note){
  var g=document.getElementById('accessGate'); if(g) g.style.display='flex';
  var n=document.getElementById('accessGateNote'); if(n) n.textContent=note||'';
}
function gateHide(){
  var g=document.getElementById('accessGate'); if(g) g.style.display='none';
}
async function checkGate(){
  var saved=null; try{ saved=localStorage.getItem(GATE_LS); }catch(e){}
  if(saved){
    /* Desbloqueo optimista (2026-09-29): ya se verifico en este dispositivo
       antes -- no hacer esperar a que responda Firestore (hasta 8s, mucho
       peor sin red) para dejar pasar. Se revalida en segundo plano SIN
       bloquear; solo vuelve a pedir la clave si de verdad se confirma
       (con conexion real) que ha cambiado. */
    gateHide();
    var live=await fetchGateKey();
    if(live!==undefined && live && live!==saved){ gateShow(''); }
    return;
  }
  var live=await fetchGateKey();
  if(live===undefined){ gateShow('Necesitas conexión la primera vez.'); return; }
  gateShow('');
}
var gateBtn=document.getElementById('accessGateBtn');
var gateInput=document.getElementById('accessGateInput');
async function attemptGateUnlock(){
  if(!gateInput) return;
  var val=(gateInput.value||'').trim();
  var errEl=document.getElementById('accessGateErr');
  if(!val) return;
  if(errEl) errEl.textContent='';
  if(gateBtn){ gateBtn.disabled=true; gateBtn.textContent='Comprobando…'; }
  var live=await fetchGateKey();
  if(gateBtn){ gateBtn.disabled=false; gateBtn.textContent='Entrar'; }
  if(live===undefined){ if(errEl) errEl.textContent='Sin conexión, inténtalo de nuevo.'; return; }
  if(live && val===live){
    try{ localStorage.setItem(GATE_LS, val); }catch(e){}
    gateHide();
  } else {
    if(errEl) errEl.textContent='Clave incorrecta.';
  }
}
if(gateBtn){ gateBtn.addEventListener('click', attemptGateUnlock); }
if(gateInput){
  gateInput.addEventListener('keydown', function(e){

/* Lectura generica de una coleccion de ranking de cualquier app de la
   suite, con hasta 3 filtros de igualdad (mismo patron where() que ya usa
   cada app para su propio ranking -- los indices compuestos que hacen
   falta ya existen, porque son la MISMA consulta que la app original). */
/* Version en directo de hubFetchRanking (2026-10-01): onSnapshot sobre la misma
   consulta. Ignora las respuestas fromCache (sin servidor no hay datos reales); con includeMetadataChanges llega tambien el paso cache->servidor aunque los datos no cambien. */
window.hubWatchRanking=function(collName, matchObj, cb){
  if(!db) return null;
  try{
    var constraints=[];
    if(matchObj){ for(var k in matchObj){ constraints.push(where(k, '==', matchObj[k])); } }
    var q = constraints.length ? query(collection(db,collName), ...constraints) : collection(db,collName);
    return onSnapshot(q, { includeMetadataChanges:true }, function(snap){
      if(snap.metadata.fromCache) return;
      var out=[]; snap.forEach(function(d){ out.push(d.data()); });
      cb(out);
    }, function(){});
  }catch(e){ return null; }
};
window.hubFetchRanking=async function(collName, matchObj){
  if(!db) return [];
  try{
    var constraints=[];
    if(matchObj){ for(var k in matchObj){ constraints.push(where(k, '==', matchObj[k])); } }
    var q = constraints.length ? query(collection(db,collName), ...constraints) : collection(db,collName);
    const snap=await getDocs(q);
    const out=[]; snap.forEach(function(d){ out.push(d.data()); });
    return out;
  }catch(e){ return null; }
};
</script>

/* Precalentar las 12 apps para que funcionen offline (2026-09-29): al
   abrir SuiteRDS con conexion, se cargan una a una en iframes invisibles
   para que cada una registre su propio Service Worker y guarde su
   cache -- asi no hace falta entrar a mano en cada una para que quede
   disponible sin red despues (entrar y salir rapido desde el ranking no
   le daba tiempo a terminar de cachear). Secuencial, no las 12 a la vez,
   para no saturar una wifi floja de gimnasio. Se usa
   navigator.serviceWorker.ready DEL PROPIO IFRAME (mismo origen, se
   puede acceder sin problema de CORS) como señal de que ya termino de
   cachear -- si algo falla o tarda, un margen de seguridad de 12s por
   app evita que se quede esperando para siempre. */
function warmApp(slug){
  return new Promise(function(resolve){
    var done=false;
    var iframe=document.createElement('iframe');
    iframe.style.cssText='position:absolute;width:0;height:0;border:0;visibility:hidden;';
    iframe.src='https://rdsk27.github.io/'+slug+'/';
    function finish(){
      if(done) return; done=true;
      clearTimeout(safety);
      try{ iframe.remove(); }catch(e){}
      resolve();
    }
    var safety=setTimeout(finish, 12000);
    iframe.addEventListener('load', function(){
      try{
        var w=iframe.contentWindow;
        if(w && w.navigator && w.navigator.serviceWorker){
          w.navigator.serviceWorker.ready.then(finish).catch(finish);
        }
      }catch(e){}
    });
    iframe.addEventListener('error', finish);
    document.body.appendChild(iframe);
  });
}
async function warmAllApps(){
  if(!navigator.onLine) return;
  for(var i=0;i<APPS.length;i++){
    await warmApp(APPS[i].slug);
  }
}

/* Puntuacion propia de Clasificacion para Tenis (Set) y Karate (Defensa) (2026-10-01):
   replica el orden de SU ranking en la app. Menor = mejor. */
function tenisSetGames(d){
  var s=d.setScores && d.setScores[0]; if(!s) return [0,0];
  return Array.isArray(s) ? [s[0]||0, s[1]||0] : [s.m||0, s.r||0];
}
/* Set: victorias primero; si gana, menos juegos concedidos; si pierde, mas juegos hechos; empate: reaccion. */
function tenisSetScore(d){
  var g=tenisSetGames(d), tie=(d.avgRT||0)/100000;
  return d.won ? (g[1]+tie) : (100-g[0]+tie);
}
function tenisSetFmt(d){ var g=tenisSetGames(d); return g[0]+'-'+g[1]+' \u00b7 '+Math.round(d.avgRT||0)+' ms'; }
/* Defensa: mas defensas primero (def), luego menor reaccion media. */
function karateDefScore(d){ return -(d.def||0)*100000 + (d.avg!=null ? d.avg : 99999); }
function karateDefFmt(d){ return (d.def||0)+'/'+(d.ensayos!=null ? d.ensayos : (d.def||0))+' \u00b7 '+Math.round(d.avg||0)+' ms'; }

function dedupeBest(docs, metric, better){

  });

     no alarga la espera de las demas, y el limite total es ~FETCH_TIMEOUT_MS
     en vez de sumarse por cada app. Sin red ni se intenta (respuesta al momento). */
  var results = liveDocs
    ? lista.map(function(cfg){ return liveDocs[cfg.slug]||null; })
    : await Promise.all(lista.map(function(cfg){
        if(!online) return null;
        return withTimeout(window.hubFetchRanking(clasifCol(cfg), cfg.clasifMatch||cfg.match), FETCH_TIMEOUT_MS);
      }));
  var meta={ offline:!online, stale:0, ts:0 };
  lista.forEach(function(cfg, i){

    else {
      var c=clasifLoadCache(cfg.slug, clasifCol(cfg));
      if(c && c.docs){ docs=c.docs; meta.stale++; meta.ts = meta.ts ? Math.min(meta.ts,c.ts) : c.ts; }
      else { docs=[]; meta.stale++; }

    if(cfg.clasifFilter) docs=docs.filter(cfg.clasifFilter);
    var ranked=dedupeBest(docs, cfg.clasifMetric||cfg.metric, cfg.better);
    ranked.slice(0,MOTOGP_POINTS.length).forEach(function(r, idx){
      var pts=pointsFor(idx);
      if(!totals[r.name]) totals[r.name]={ name:r.name, points:0, apps:[] };
      totals[r.name].points += pts;

  });
  /* Si alguna app no responde, no esperar para siempre: tras FETCH_TIMEOUT_MS
     se pinta con lo que haya (copia guardada para las que faltan). */
  clasifFirstTo=setTimeout(function(){ clasifFirstTo=null; if(!clasifPainted) repaintClasificacion(); }, FETCH_TIMEOUT_MS);
}
document.addEventListener('visibilitychange', function(){
  var panel=$('panel-clasificacion');
  if(document.visibilityState==='hidden'){ stopClasifWatch(); }
  else if(panel && panel.classList.contains('active')){ renderClasificacion(); }
});
window.addEventListener('online', function(){ var panel=$('panel-clasificacion'); if(panel && panel.classList.contains('active')) renderClasificacion(); });
function paintClasificacion(list, meta){
  var host=$('clasifBody');
  var openNames={}; Array.prototype.forEach.call(host.querySelectorAll('.clasif-row.open .clasif-name'), function(n){ openNames[n.textContent]=1; });
  if(!host.dataset.clasifBound){
    host.dataset.clasifBound='1';
    /* Delegado en el contenedor (persiste entre re-renders de innerHTML,
       a diferencia de listeners puestos fila por fila): pulsar un cuadro
       muestra app/puesto/resultado, volver a pulsar lo oculta. */
    host.addEventListener('click', function(e){
      var row=e.target.closest('.clasif-row');
      if(row) row.classList.toggle('open');
    });
  }
  if(!list.length){ host.innerHTML=clasifNoteHtml(meta)+'<div class="hint">'+(meta&&meta.offline?'Sin conexi\u00f3n y sin datos guardados todav\u00eda: abre la clasificaci\u00f3n con conexi\u00f3n al menos una vez.':'Todav\u00eda no hay marcas guardadas en los rankings oficiales.')+'</div>'; return; }
  var html=clasifNoteHtml(meta)+'<div class="clasif-list">';
  var me=getMe();
  list.forEach(function(row, idx){
    var medal = idx===0?' gold':(idx===1?' silver':(idx===2?' bronze':''));
    var detalle = row.apps.map(function(a){ return '<div class="clasif-det-line"><span>'+esc(a.app)+'</span><span>'+(a.fmt ? a.fmt(a.doc) : fmtVal(a.val,{unidad:a.unidad}))+'</span></div>'; }).join('');
    html += '<div class="clasif-row'+(me && row.name===me?' is-me':'')+'">'
      + '<div class="clasif-pos'+medal+'">'+(idx+1)+'</div>'
      + '<div class="clasif-mid"><div class="clasif-name">'+esc(row.name)+'</div><div class="clasif-detalle">'+detalle+'</div></div>'
      + '<div class="clasif-pts">'+row.points+'</div>'
      + '</div>';
  });
  html+='</div><button class="add-prueba" id="btnRefreshClasif" style="margin-top:14px;">Actualizar</button>';
  host.innerHTML=html;
  Array.prototype.forEach.call(host.querySelectorAll('.clasif-row'), function(r){ var n=r.querySelector('.clasif-name'); if(n && openNames[n.textContent]) r.classList.add('open'); });
  $('btnRefreshClasif').addEventListener('click', renderClasificacion);
}

   / resource.data.adminKey) para poder escribir/editar/borrar campeonatos.
   Se guarda en localStorage para no volver a teclearla en este dispositivo. */

var ADMIN_LS='suiterds_admin_key';

function closeAdminLogin(){ $('adminLoginBox').innerHTML=''; }
function renderAdminLogin(){
  var box=$('adminLoginBox');

    +'<div class="admin-login">'
    +'<input type="text" id="adminPinInput" placeholder="Clave admin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'

/* ---------- Campeonatos: listado ---------- */
var CHAMPS=[];
function tipoLabel(t){ return t==='avg' ? 'Valor' : 'Posici&#243;n'; }
/* Numeracion automatica de campeonatos (2026-09-28): cada campeonato nuevo
   recibe el siguiente numero libre (maximo actual + 1) al crearse, fijo de
   por vida -- no se recalcula al editar ni al borrar otros. El nombre que
   se ve siempre es "Campeonato N - <titulo>"; los campeonatos antiguos sin
   "number" (creados antes de este cambio) se siguen viendo solo con su
   titulo, sin numero. */
function nextChampNumber(){
  var max=0;
  CHAMPS.forEach(function(c){ if(c.number>max) max=c.number; });
  return max+1;
}
function champFullName(c){
  return c.number ? ('Campeonato '+c.number+' - '+(c.title||'')) : (c.title||'');
}
function appNameOf(slug){ var a=APPS.filter(function(x){ return x.slug===slug; })[0]; return a?a.name:slug; }
function renderChampList(){
  var host=$('champList');
  if(!CHAMPS.length){
    host.innerHTML='<div class="hint">A&#250;n no hay campeonatos creados.</div>';
    return;
  }
  host.innerHTML='';
  CHAMPS.forEach(function(c){
    var card=document.createElement('div'); card.className='champ-card';
    var pruebasTxt=(c.entries||[]).map(function(e){
      var adapter=adapterOf(e.app);
      var nm=(adapter && adapter.dims && e.dimValues) ? (adapter.name+' &middot; '+esc(adapter.dimLabel(e.dimValues))) : appNameOf(e.app);
      return nm+' ('+tipoLabel(e.tipo)+')';
    }).join('<br>');
    card.innerHTML='<h3>'+esc(champFullName(c))+'</h3>'
      +'<div class="pruebas">'+pruebasTxt+'</div>'
      +'<button class="champ-open" data-id="'+c.id+'">Ver tabla</button>'
      +(isAdmin()?('<div class="champ-actions"><button class="edit" data-id="'+c.id+'">Editar</button><button class="danger del" data-id="'+c.id+'">Borrar</button></div>'):'');
    host.appendChild(card);
  });
  host.querySelectorAll('.champ-open').forEach(function(b){ b.addEventListener('click', function(){ openChampTable(b.getAttribute('data-id')); }); });
  host.querySelectorAll('.edit').forEach(function(b){ b.addEventListener('click', function(){ openChampForm(b.getAttribute('data-id')); }); });
  host.querySelectorAll('.del').forEach(function(b){ b.addEventListener('click', function(){ deleteChamp(b.getAttribute('data-id')); }); });
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
async function loadChamps(){
  CHAMPS = window.hubLoadChamps ? (await window.hubLoadChamps()) : [];
  CHAMPS.sort(function(a,b){ return (a.number||0)-(b.number||0) || (a.createdAt||0)-(b.createdAt||0); });
  renderChampList();
}

/* ---------- Campeonatos: tabla en vivo ----------
   Se lee el ranking real de cada prueba (mismo adaptador que Clasificacion,
   ver APP_ADAPTERS) y se cruza: filas = todas las personas que aparecen en
   AL MENOS una prueba, columnas = las pruebas elegidas. La celda ensena
   posicion o valor bruto segun lo que eligio el admin (tipo), pero los
   PUNTOS de la columna "Total" siempre se calculan por posicion dentro de
   esa prueba (escala MotoGP, igual que Clasificacion) -- asi se puede
   comparar aunque se mezclen columnas de posicion y de valor. */
function fmtVal(val, adapter){
  if(adapter.unidad==='ms') return Math.round(val)+' ms';
  if(adapter.unidad==='s') return val.toFixed(2)+' s';
  if(adapter.unidad==='cartas') return val+' cartas';
  if(adapter.unidad==='pts') return val.toFixed(1)+' pts';
  return String(val);
}
/* Resuelve la coleccion/filtro reales de una prueba: si la app tiene
   "dims" y la prueba trae dimValues, se usa el combo elegido -- ya sea
   construyendo una coleccion a medida (buildCollection, solo Velocidad de
   Reaccion, que reparte el ranking en una coleccion por combinacion) o
   filtrando con where() la coleccion unica de la app (buildMatch, el
   resto -- mismo patron que adapter.match de siempre pero con los valores
   que eligio el admin en vez de los oficiales). Si no hay dims o no se
   eligio nada, se usa el combo oficial de siempre (adapter.collection/match). */
function resolveEntryQuery(adapter, entry){
  if(adapter.dims && entry.dimValues){
    if(adapter.buildCollection){
      return { collection:adapter.buildCollection(entry.dimValues), match:null,
                label:adapter.name+' ('+adapter.dimLabel(entry.dimValues)+')' };
    }
    var m = adapter.buildMatch ? adapter.buildMatch(entry.dimValues) : entry.dimValues;
    return { collection:adapter.collection, match:m,
              label:adapter.name+' ('+adapter.dimLabel(entry.dimValues)+')' };
  }
  return { collection:adapter.collection, match:adapter.match, label:adapter.name };
}
async function computeChampTable(entries){
  var valid=entries.map(function(entry){
    var adapter=adapterOf(entry.app); if(!adapter) return null;
    return { entry:entry, adapter:adapter, q:resolveEntryQuery(adapter, entry) };
  }).filter(function(x){ return x; });   // prueba de una app sin adaptador (p.ej. quitada despues) -- se omite
  /* En paralelo, con limite de tiempo por prueba -- ver FETCH_TIMEOUT_MS,
     mismo motivo que en Clasificacion ("se queda en Calculando..."). */
  var results=await Promise.all(valid.map(function(x){
    return withTimeout(window.hubFetchRanking(x.q.collection, x.q.match), FETCH_TIMEOUT_MS);
  }));
  var columns=[], rows={};
  valid.forEach(function(x, i){
    var adapter=x.adapter, docs=results[i];
    var col={ label:x.q.label, tipo:x.entry.tipo, unidad:adapter.unidad, adapter:adapter };
    columns.push(col);
    if(docs==null) return;   // fallo o timeout en esa prueba -- columna vacia, no rompe las demas
    var ranked=dedupeBest(docs, adapter.metric, adapter.better);
    ranked.forEach(function(r, idx){
      if(!rows[r.name]) rows[r.name]={ name:r.name, cells:{}, points:0 };
      var pts=pointsFor(idx);
      rows[r.name].cells[col.label+'#'+columns.length]={ pos:idx+1, val:r.val, pts:pts };
      rows[r.name].points+=pts;
    });
  });
  var list=Object.keys(rows).map(function(k){ return rows[k]; });
  list.sort(function(a,b){ return b.points-a.points; });
  return { columns:columns, rows:list };
}
async function openChampTable(id){
  var c=CHAMPS.filter(function(x){ return x.id===id; })[0]; if(!c) return;
  $('champList').style.display='none';
  $('btnNewChamp').style.display='none';
  var view=$('champTableView');
  view.style.display='';
  view.innerHTML='<button class="champ-table-back" id="btnBackChamp">&larr; Volver a Campeonatos</button>'
    +'<div class="champ-table-title">'+esc(champFullName(c))+'</div>'
    +'<div class="hint" style="padding:6px 0 14px;">Calculando&hellip;</div>';
  $('btnBackChamp').addEventListener('click', closeChampTable);
  try{
    var data=await computeChampTable(c.entries||[]);
    paintChampTable(c, data);
  }catch(e){
    view.querySelector('.hint').textContent='No se pudo calcular la tabla. Comprueba la conexión.';
  }
}
function closeChampTable(){
  $('champTableView').style.display='none';
  $('champTableView').innerHTML='';
  $('champList').style.display='';
  $('btnNewChamp').style.display=isAdmin()?'':'none';
}
function paintChampTable(c, data){
  var view=$('champTableView');
  if(!data.columns.length){
    view.innerHTML='<button class="champ-table-back" id="btnBackChamp">&larr; Volver a Campeonatos</button>'
      +'<div class="champ-table-title">'+esc(champFullName(c))+'</div>'
      +'<div class="hint">Este campeonato no tiene pruebas validas todavía.</div>';
    $('btnBackChamp').addEventListener('click', closeChampTable);
    return;
  }
  if(!data.rows.length){
    view.innerHTML='<button class="champ-table-back" id="btnBackChamp">&larr; Volver a Campeonatos</button>'
      +'<div class="champ-table-title">'+esc(champFullName(c))+'</div>'
      +'<div class="hint">Todavía no hay marcas guardadas en ninguna de estas pruebas.</div>';
    $('btnBackChamp').addEventListener('click', closeChampTable);
    return;
  }
  var thead='<tr><th class="champ-name-th">Jugador</th>';
  data.columns.forEach(function(col){ thead+='<th>'+esc(col.label)+'<br>('+tipoLabel(col.tipo)+')</th>'; });
  thead+='<th>Total</th></tr>';
  var tbody='';
  var me=getMe();
  data.rows.forEach(function(row){
    tbody+='<tr'+(me && row.name===me?' class="is-me"':'')+'><td class="champ-name-cell">'+esc(row.name)+'</td>';
    data.columns.forEach(function(col, ci){
      var cell=row.cells[col.label+'#'+(ci+1)];
      if(!cell){ tbody+='<td class="champ-empty">&mdash;</td>'; return; }
      var shown = col.tipo==='avg' ? fmtVal(cell.val, col.adapter) : (cell.pos+'&#186;');
      tbody+='<td>'+shown+'</td>';
    });
    tbody+='<td class="champ-pts-cell">'+row.points+'</td></tr>';
  });
  view.innerHTML='<button class="champ-table-back" id="btnBackChamp">&larr; Volver a Campeonatos</button>'
    +'<div class="champ-table-title">'+esc(champFullName(c))+'</div>'
    +'<div class="hint" style="padding:0 0 10px;text-align:left;">"Total" son puntos MotoGP seg&uacute;n el puesto en cada prueba (aunque la columna ense&ntilde;e el valor bruto).</div>'
    +'<div class="champ-table-scroll"><table class="champ-table"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
  $('btnBackChamp').addEventListener('click', closeChampTable);
}

/* ---------- Campeonatos: crear / editar ---------- */
var FORM_ENTRIES=[], FORM_EDIT_ID=null, FORM_CHAMP_NUMBER=null;
function closeChampForm(){ $('champForm').innerHTML=''; FORM_ENTRIES=[]; FORM_EDIT_ID=null; FORM_CHAMP_NUMBER=null; }
function openChampForm(editId){
  if(!isAdmin()) return;
  FORM_EDIT_ID = editId || null;
  var existing = editId ? CHAMPS.filter(function(x){ return x.id===editId; })[0] : null;
  FORM_ENTRIES = existing ? (existing.entries||[]).map(function(e){
    var copy=Object.assign({}, e);
    if(copy.dimValues) copy.dimValues=Object.assign({}, copy.dimValues);   // copia aparte, no tocar el original hasta Guardar
    return copy;
  }) : [];
  var champNumber = existing ? (existing.number || nextChampNumber()) : nextChampNumber();
  FORM_CHAMP_NUMBER = champNumber;
  var box=$('champForm');
  box.innerHTML='<div class="champ-form">'
    +'<label>T&#237;tulo</label>'
    +'<div class="champ-title-row"><span class="champ-num-prefix">Campeonato '+champNumber+' -</span>'
    +'<input type="text" id="champTitleInput" placeholder="p. ej. MixMS" value="'+esc(existing?existing.title:'')+'"></div>'
    +'<label>Pruebas</label>'
    +'<div id="pruebaRows"></div>'
    +'<button type="button" class="add-prueba" id="btnAddPrueba">+ A&#241;adir prueba</button>'
    +'<div class="champ-form-actions"><button class="save" id="btnSaveChamp">Guardar</button><button class="cancel" id="btnCancelChamp">Cancelar</button></div>'
    +'</div>';
  renderPruebaRows();
  $('btnAddPrueba').addEventListener('click', function(){ FORM_ENTRIES.push({app:APP_ADAPTERS[0].slug, tipo:'pos'}); renderPruebaRows(); });
  $('btnSaveChamp').addEventListener('click', saveChampForm);
  $('btnCancelChamp').addEventListener('click', closeChampForm);
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
/* Valores de dims por defecto = el combo oficial de la app (mismo que
   Clasificacion), para que "no tocar nada" siga dando el mismo resultado
   de siempre. */
function defaultDimValues(adapter){
  var v={};
  (adapter.dims||[]).forEach(function(d){ v[d.key]=d.def; });
  return v;
}
function renderPruebaRows(){
  var host=$('pruebaRows'); if(!host) return;
  host.innerHTML='';
  FORM_ENTRIES.forEach(function(entry, idx){
    var wrap=document.createElement('div');
    var row=document.createElement('div'); row.className='prueba-row';
    var appSel=document.createElement('select');
    APP_ADAPTERS.forEach(function(a){ var o=document.createElement('option'); o.value=a.slug; o.textContent=a.name.replace(/&#\d+;/g,''); if(a.slug===entry.app) o.selected=true; appSel.appendChild(o); });
    appSel.addEventListener('change', function(){
      entry.app=appSel.value;
      var adapter=adapterOf(entry.app);
      entry.dimValues = (adapter && adapter.dims) ? defaultDimValues(adapter) : undefined;
      renderPruebaRows();
    });
    var tipoSel=document.createElement('select'); tipoSel.className='tipo';
    ['pos','avg'].forEach(function(t){ var o=document.createElement('option'); o.value=t; o.textContent=(t==='pos'?'Posición':'Valor'); if(t===entry.tipo) o.selected=true; tipoSel.appendChild(o); });
    tipoSel.addEventListener('change', function(){ entry.tipo=tipoSel.value; });
    var rm=document.createElement('button'); rm.type='button'; rm.className='rm-row'; rm.textContent='×';
    rm.addEventListener('click', function(){ FORM_ENTRIES.splice(idx,1); renderPruebaRows(); });
    row.appendChild(appSel); row.appendChild(tipoSel); row.appendChild(rm);
    wrap.appendChild(row);

    var adapter=adapterOf(entry.app);
    if(adapter && adapter.dims){
      if(!entry.dimValues) entry.dimValues=defaultDimValues(adapter);
      if(adapter.constrain) adapter.constrain(entry.dimValues);
      var dimsRow=document.createElement('div'); dimsRow.className='prueba-dims';
      adapter.dims.forEach(function(d){
        var sel=document.createElement('select');
        sel.disabled = !!(adapter.disabledDim && adapter.disabledDim(entry.dimValues, d.key));
        d.options.forEach(function(o){
          var opt=document.createElement('option'); opt.value=o.value; opt.textContent=o.label;
          if(adapter.disabledOption && adapter.disabledOption(entry.dimValues, d.key, o.value)) opt.disabled=true;
          if(o.value===entry.dimValues[d.key]) opt.selected=true;
          sel.appendChild(opt);
        });
        sel.addEventListener('change', function(){
          entry.dimValues[d.key]=sel.value;
          if(adapter.constrain) adapter.constrain(entry.dimValues);
          renderPruebaRows();
        });
        dimsRow.appendChild(sel);
      });
      wrap.appendChild(dimsRow);
    }
    host.appendChild(wrap);
  });
}
async function saveChampForm(){
  var title=($('champTitleInput').value||'').trim();
  if(!title){ $('champTitleInput').style.borderColor='#b03020'; return; }
  if(!FORM_ENTRIES.length){ alert('Añade al menos una prueba.'); return; }
  var rec={ title:title, entries:FORM_ENTRIES, adminKey:ADMIN_KEY, updatedAt:Date.now() };
  try{
    if(FORM_EDIT_ID){ await window.hubUpdateChamp(FORM_EDIT_ID, rec); }
    else { rec.number=FORM_CHAMP_NUMBER; rec.createdAt=Date.now(); await window.hubAddChamp(rec); }
    closeChampForm();
    await loadChamps();
  }catch(e){ alert('No se pudo guardar. Comprueba la conexión o las reglas de Firestore.'); }
}
async function deleteChamp(id){
  if(!confirm('¿Seguro que quieres borrar este campeonato?')) return;
  try{ await window.hubDeleteChamp(id); await loadChamps(); }
  catch(e){ alert('No se pudo borrar.'); }
}

$('btnNewChamp').addEventListener('click', function(){ openChampForm(null); });

renderAdminBar();
loadChamps();
</script>
